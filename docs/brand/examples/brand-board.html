<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>RiseXPTO Brand Board</title>
    <link rel="stylesheet" href="../tokens.css" />
    <style>
      body {
        margin: 0;
        background: var(--rx-color-canvas);
        color: var(--rx-color-text);
        font: 16px/1.5 var(--rx-font-sans);
      }
      main {
        max-width: 960px;
        margin: auto;
        padding: var(--rx-space-10);
      }
      section {
        margin-block: var(--rx-space-10);
      }
      .card {
        background: var(--rx-color-surface);
        border: 1px solid var(--rx-color-border);
        border-radius: var(--rx-radius-lg);
        box-shadow: var(--rx-shadow-sm);
        padding: var(--rx-space-6);
      }
      .row {
        display: flex;
        gap: var(--rx-space-4);
        flex-wrap: wrap;
      }
      .swatch {
        width: 120px;
        height: 88px;
        border-radius: var(--rx-radius-md);
        padding: 12px;
        color: white;
        font-size: 12px;
      }
      .value {
        font-size: 32px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      .muted {
        color: var(--rx-color-text-muted);
      }
      button {
        height: var(--rx-control-md);
        border: 0;
        border-radius: var(--rx-radius-md);
        background: var(--rx-color-brand);
        color: white;
        padding: 0 18px;
        font: 600 14px var(--rx-font-sans);
      }
      img {
        max-width: 268px;
      }
      .dark {
        background: #080d18;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="card">
        <img src="../logo/risexpto-horizontal-dark.svg" alt="RiseXPTO" />
        <h1>Controlled automation. Precise execution.</h1>
        <p class="muted">A calm operating layer for systematic crypto trading.</p>
        <button>Start in Paper mode</button>
      </section>
      <section>
        <h2>Core palette</h2>
        <div class="row">
          <div class="swatch" style="background: #3657d6">Brand<br />#3657D6</div>
          <div class="swatch" style="background: #101828">Ink<br />#101828</div>
          <div class="swatch" style="background: #087a55">Positive<br />#087A55</div>
          <div class="swatch" style="background: #c9364f">Negative<br />#C9364F</div>
        </div>
      </section>
      <section class="card">
        <p class="muted">Portfolio value</p>
        <div class="value">$128,420.36</div>
        <p style="color: var(--rx-color-positive)">+2.84% this month</p>
      </section>
      <section class="card dark">
        <img src="../logo/risexpto-horizontal-light.svg" alt="RiseXPTO on dark background" />
      </section>
    </main>
  </body>
</html>
